<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartwheel Conversation Review</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #dcdad4;
  --user: #e7f0fb; --user-edge: #3d7cc9; --agent: #ffffff; --agent-edge: #b8b6af;
  --tool: #fdf6e7; --tool-edge: #c9952f; --err: #c43d3d; --err-bg: #fcebea;
  --note: #fff4b8; --note-edge: #d8b400; --sugg: #eef0f7; --sugg-edge: #6b74a8;
  --ok: #2f7d4f; --present: #c43d3d; --absent: #2f7d4f;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
  padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
header h1 span { color: var(--muted); font-weight: 400; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { border: 1px solid var(--line); background: var(--bg); padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
nav .count { color: var(--muted); font-size: 12px; margin-left: 4px; }
nav button.active .count { color: #ddd; }
#status { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.view { display: none; } .view.active { display: block; }
button.small { font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
button.small:hover { border-color: var(--ink); }
button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
a { color: var(--user-edge); }
.muted { color: var(--muted); } .mono { font-family: var(--mono); font-size: 12px; }

/* review layout */
#review { display: grid; grid-template-columns: 250px minmax(0, 1fr); height: calc(100vh - 47px); }
#list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
#list .filters { position: sticky; top: 0; background: var(--panel); padding: 8px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
#list select, #list input { width: 100%; font: inherit; font-size: 12px; padding: 3px; }
.row { padding: 6px 10px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.row:hover { background: var(--bg); } .row.cur { background: #ece9e1; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--muted); flex: none; }
.dot.fail { background: var(--present); border-color: var(--present); }
.dot.clean { background: var(--absent); border-color: var(--absent); }
.row .tag { margin-left: auto; font-size: 11px; color: var(--muted); }
#main { overflow-y: auto; padding: 16px 20px 80px; }
.conv-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-bottom: 8px; }
.conv-head h2 { margin: 0; font-size: 18px; }
.conv-head .meta { color: var(--muted); font-size: 12px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin: 8px 0 12px; flex-wrap: wrap; }
details.key { background: var(--panel); border: 1px dashed var(--line); border-radius: 6px; padding: 6px 10px; margin-bottom: 12px; }
details.key summary { cursor: pointer; color: var(--muted); }
details.key pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; margin: 6px 0 0; }
.reading { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; }
.convo { position: relative; }
.margin { position: relative; }
.turn-divider { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin: 18px 0 8px; }
.turn-divider::before, .turn-divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.msg { border-radius: 8px; padding: 8px 12px; margin: 6px 0; border-left: 3px solid; background: var(--agent); }
.msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }
.msg.user { background: var(--user); border-color: var(--user-edge); }
.msg.assistant { background: var(--agent); border-color: var(--agent-edge); }
.msg .text { white-space: pre-wrap; }
.tool { background: var(--tool); border: 1px solid #ecd9ab; border-left: 3px solid var(--tool-edge); border-radius: 8px; padding: 8px 12px; margin: 6px 0; }
.tool.error { background: var(--err-bg); border-color: #efc2bf; border-left-color: var(--err); }
.tool .sig { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
.tool .status { font-family: var(--mono); font-size: 12px; margin-left: 6px; }
.tool .status.bad { color: var(--err); font-weight: 600; } .tool .status.good { color: var(--ok); }
table.kv, table.grid { border-collapse: collapse; margin-top: 6px; font-family: var(--mono); font-size: 12px; }
table.kv td, table.grid td, table.grid th { border: 1px solid #ead9b2; padding: 2px 6px; vertical-align: top; text-align: left; }
table.kv td:first-child { color: var(--muted); }
table.grid th { background: #f6ead0; font-weight: 600; }
.longtext { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; max-height: 120px; overflow: hidden; }
.longtext.open { max-height: none; }
.rawtoggle { margin-top: 4px; }
pre.raw { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 11.5px; background: #fffdf7; border: 1px solid #eee; padding: 6px; margin: 4px 0 0; }
mark.ann { background: var(--note); border-bottom: 2px solid var(--note-edge); padding: 0 1px; }
mark.ann.hot { background: #ffe36b; }
mark.pending { background: #cfe1ff; }
mark.sugg { background: transparent; border-bottom: 2px dashed var(--sugg-edge); }
.mnote { position: absolute; left: 0; right: 0; background: var(--note); border: 1px solid var(--note-edge); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.mnote.clean { background: #e4f3e9; border-color: var(--absent); }
.mnote.hot { box-shadow: 0 0 0 2px #ffe36b; }
.mnote .q { font-size: 11.5px; color: var(--muted); font-style: italic; margin-bottom: 2px; }
.mnote .acts { display: none; gap: 4px; margin-top: 4px; } .mnote:hover .acts { display: flex; }
.mnote textarea { width: 100%; font: inherit; font-size: 13px; }
.msugg { position: absolute; left: 0; right: 0; background: var(--sugg); border: 1px dashed var(--sugg-edge); border-left: 4px solid var(--sugg-edge); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.msugg .tag, .sugg-card .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--sugg-edge); font-weight: 600; }
.popover { position: absolute; z-index: 30; width: 320px; background: var(--panel); border: 1px solid var(--ink); border-radius: 8px; padding: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
.popover textarea { width: 100%; min-height: 70px; font: inherit; }
.popover .hint { font-size: 11px; color: var(--muted); }
.labels-panel { margin-top: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.labels-panel h3 { margin: 0 0 6px; font-size: 14px; }
.lrow { display: grid; grid-template-columns: 280px 180px minmax(0, 1fr); gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid #f0eee9; }
.lrow .name { font-family: var(--mono); font-size: 12.5px; }
.lrow .cand { font-size: 10.5px; color: var(--muted); }
.lrow input[type=text] { width: 100%; font: inherit; font-size: 12px; }
.lrow .ldef { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); }
.lacts { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid #f0eee9; font-size: 12px; }
.seg button { font: inherit; font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.seg button:first-child { border-radius: 5px 0 0 5px; } .seg button:last-child { border-radius: 0 5px 5px 0; }
.seg button.on.present { background: var(--present); color: #fff; border-color: var(--present); }
.seg button.on.absent { background: var(--absent); color: #fff; border-color: var(--absent); }

/* other views */
.page { max-width: 1150px; margin: 0 auto; padding: 16px 20px 80px; }
.page h2 { font-size: 18px; margin: 4px 0 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 4px; font-family: var(--mono); font-size: 14px; }
.pill { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 10px; border: 1px solid var(--line); margin-left: 6px; font-family: var(--sans); font-weight: 400; vertical-align: 1px; }
.pill.confirmed { background: #e4f3e9; border-color: var(--absent); } .pill.candidate { background: #fff4d6; border-color: #e0b84b; }
.pill.rejected, .pill.merged { background: #eee; color: var(--muted); }
.card dl { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 3px 12px; margin: 8px 0; font-size: 13px; }
.card dt { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; background: var(--bg); }
.chip:hover { border-color: var(--ink); }
.origin { border-left: 3px solid var(--note-edge); padding: 2px 8px; margin: 4px 0; font-size: 13px; cursor: pointer; }
.origin .q { color: var(--muted); font-style: italic; font-size: 12px; }
.sugg-card { background: var(--sugg); border: 1px dashed var(--sugg-edge); border-left: 4px solid var(--sugg-edge); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
.sugg-card.accepted { background: #eef6f0; border-color: var(--absent); border-style: solid; }
.sugg-card.rejected { background: #f3f3f3; border-color: #aaa; border-style: solid; }
.sugg-card .acts { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.sugg-card input { flex: 1; font: inherit; font-size: 12px; }
table.labels { border-collapse: collapse; font-size: 12.5px; background: var(--panel); }
table.labels th, table.labels td { border: 1px solid var(--line); padding: 3px 7px; text-align: center; }
table.labels th { position: sticky; top: 47px; background: #f0eee8; font-family: var(--mono); font-weight: 600; font-size: 11.5px; }
table.labels td:first-child, table.labels th:first-child { text-align: left; }
table.labels td.p { background: #f8dcda; color: var(--present); font-weight: 600; }
table.labels td.a { background: #e1f1e6; color: var(--absent); }
table.labels td.n { background: #fff; color: #bbb; }
table.labels tr:hover td { outline: 1px solid #ccc; cursor: pointer; }
table.stats { border-collapse: collapse; background: var(--panel); font-size: 13px; }
table.stats th, table.stats td { border: 1px solid var(--line); padding: 4px 10px; text-align: right; }
table.stats th:first-child, table.stats td:first-child { text-align: left; }
.toast { position: fixed; bottom: 16px; right: 16px; background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 50; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Cartwheel <span>conversation review</span></h1>
  <nav id="nav">
    <button data-view="review" class="active">Review<span class="count" id="c-review"></span></button>
    <button data-view="taxonomy">Taxonomy<span class="count" id="c-taxonomy"></span></button>
    <button data-view="suggestions">Suggestions<span class="count" id="c-suggestions"></span></button>
    <button data-view="labeling">Labeling<span class="count" id="c-labeling"></span></button>
    <button data-view="progress">Progress</button>
  </nav>
  <div id="status">loading…</div>
</header>

<div id="v-review" class="view active">
  <div id="review">
    <aside id="list">
      <div class="filters">
        <select id="f-scope">
          <option value="sample">Review sample (manifest)</option>
          <option value="all">All conversations</option>
        </select>
        <select id="f-batch"><option value="">All batches</option></select>
        <select id="f-state">
          <option value="">Any review state</option>
          <option value="todo">Not reviewed</option>
          <option value="fail">Failure noted</option>
          <option value="clean">No failure observed</option>
        </select>
        <input id="f-text" placeholder="Filter by scenario ID or role">
      </div>
      <div id="rows"></div>
    </aside>
    <main id="main"></main>
  </div>
</div>
<div id="v-taxonomy" class="view"><div class="page" id="taxonomy"></div></div>
<div id="v-suggestions" class="view"><div class="page" id="suggestions"></div></div>
<div id="v-labeling" class="view"><div class="page" id="labeling"></div></div>
<div id="v-progress" class="view"><div class="page" id="progress"></div></div>

<script>
const S = {
  convs: [], byId: {}, manifest: {items: []}, annotations: [], patterns: {modes: []},
  suggestions: [], labels: {}, view: 'review', cur: null, pending: null, editing: null,
};
const BATCH_NAMES = {
  initial_random: 'Initial random (15)', cluster: 'Cluster representatives (15)',
  dimension: 'Dimension batch (30)', depth: 'Depth searches (25)', final_random: 'Final random (15)',
  search_round2: 'Second search round',
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const short = (id) => String(id || '').slice(0, 8);
const now = () => new Date().toISOString().replace(/\.\d+Z$/, 'Z');
const newId = (p) => `${p}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;

async function api(path, body) {
  const opts = body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)};
  const r = await fetch(path, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || data.langfuse || r.status);
  return data;
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ---------- derived state ---------- */
const liveAnns = () => S.annotations.filter((a) => !a.deleted_at);
const annsFor = (cid) => liveAnns().filter((a) => a.trace_id === cid);
function reviewState(cid) {
  const a = annsFor(cid);
  if (a.some((x) => x.kind === 'failure')) return 'fail';
  if (a.some((x) => x.kind === 'no_failure')) return 'clean';
  return 'todo';
}
const manifestItems = () => S.manifest.items || [];
const batchOf = (cid) => (manifestItems().find((i) => i.conversation_id === cid) || {}).batch;
const activeModes = () => (S.patterns.modes || []).filter((m) => !['rejected', 'merged'].includes(m.status));
const confirmedModes = () => (S.patterns.modes || []).filter((m) => m.status === 'confirmed');
const labelOf = (mode, cid) => (S.labels[mode] || {})[cid];
const pendingSuggs = () => S.suggestions.filter((s) => (s.status || 'pending') === 'pending');

function listConvs() {
  const scope = $('f-scope').value, batch = $('f-batch').value, st = $('f-state').value;
  const q = $('f-text').value.trim().toLowerCase();
  let ids = scope === 'sample' ? manifestItems().map((i) => i.conversation_id).filter((id) => S.byId[id]) : S.convs.map((c) => c.id);
  if (batch) ids = ids.filter((id) => batchOf(id) === batch);
  if (st) ids = ids.filter((id) => reviewState(id) === st);
  if (q) ids = ids.filter((id) => { const c = S.byId[id]; return (c.scenario_id + ' ' + c.role).toLowerCase().includes(q); });
  return ids;
}

/* ---------- sidebar ---------- */
function renderRows() {
  const ids = listConvs();
  $('rows').innerHTML = ids.length ? ids.map((id) => {
    const c = S.byId[id], st = reviewState(id), b = batchOf(id);
    return `<div class="row ${id === S.cur ? 'cur' : ''}" data-id="${id}"><span class="dot ${st}"></span>
      <span>${esc(c.scenario_id)}<br><span class="muted" style="font-size:11.5px">${esc(c.role)} · ${c.turns.length} turn${c.turns.length > 1 ? 's' : ''}</span></span>
      <span class="tag">${esc(b ? b.replace('_', ' ') : '')}</span></div>`;
  }).join('') : `<div class="empty">${$('f-scope').value === 'sample' && !manifestItems().length ? 'The review sample is empty. Switch to “All conversations” or wait for the first batch.' : 'No conversations match.'}</div>`;
  $('rows').querySelectorAll('.row').forEach((r) => r.onclick = () => openConv(r.dataset.id));
}
function openConv(id) {
  S.cur = id; S.pending = null; S.editing = null;
  switchView('review'); renderRows(); renderConv();
  $('main').scrollTop = 0;
  const row = $('rows').querySelector(`.row[data-id="${id}"]`); if (row) row.scrollIntoView({block: 'nearest'});
}
function step(delta) {
  const ids = listConvs(); if (!ids.length) return;
  const i = ids.indexOf(S.cur);
  openConv(ids[Math.max(0, Math.min(ids.length - 1, (i < 0 ? 0 : i + delta)))]);
}

/* ---------- rendering a conversation ---------- */
function parse(v) { if (typeof v === 'string') { try { return JSON.parse(v); } catch { return v; } } return v; }
function scalar(v) {
  if (v === null) return '<span class="muted">null</span>';
  if (typeof v === 'object') return esc(JSON.stringify(v));
  return esc(v);
}
function kvTable(obj) {
  return `<table class="kv">${Object.entries(obj).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${
    typeof v === 'string' && v.length > 220 ? `<div class="longtext">${esc(v)}</div><button class="small more">show all</button>` : scalar(v)}</td></tr>`).join('')}</table>`;
}
function gridTable(rows, key) {
  const cols = [...new Set(rows.flatMap((r) => Object.keys(r)))];
  const LIMIT = 6;
  const body = rows.map((r, i) => `<tr class="${i >= LIMIT ? 'extra' : ''}" ${i >= LIMIT ? 'hidden' : ''}>${cols.map((c) => {
    const v = r[c];
    return `<td>${typeof v === 'string' && v.length > 160 ? esc(v.slice(0, 160)) + '…' : scalar(v)}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="muted" style="font-size:12px;margin-top:4px">${esc(key)}: ${rows.length} row${rows.length === 1 ? '' : 's'}</div>
    <table class="grid"><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr>${body}</table>
    ${rows.length > LIMIT ? `<button class="small showrows">show all ${rows.length}</button>` : ''}`;
}
function renderResult(res) {
  if (!res || typeof res !== 'object') return `<div class="longtext">${esc(res)}</div>`;
  let html = '';
  const flat = {};
  for (const [k, v] of Object.entries(res)) {
    if (k === 'ok') continue;
    if (Array.isArray(v) && v.length && typeof v[0] === 'object') html += gridTable(v, k);
    else if (v && typeof v === 'object' && !Array.isArray(v)) html += `<div class="muted" style="font-size:12px;margin-top:4px">${esc(k)}</div>` + kvTable(v);
    else flat[k] = v;
  }
  return (Object.keys(flat).length ? kvTable(flat) : '') + html;
}
function toolBox(call, result, ref) {
  const args = parse(call?.arguments) || {};
  const res = parse(result?.content);
  const name = (call || result).name;
  const argText = args && typeof args === 'object'
    ? Object.entries(args).filter(([, v]) => v !== null && v !== undefined).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(', ')
    : esc(args);
  const failed = res && typeof res === 'object' && res.ok === false;
  const status = !result ? '<span class="status bad">no result recorded</span>'
    : failed ? `<span class="status bad">ok: false · ${esc(res.error || '')}</span>`
    : (res && typeof res === 'object' && res.ok === true ? '<span class="status good">ok</span>' : '');
  return `<div class="tool ${failed ? 'error' : ''}" data-ref="${ref}">
    <div class="sig text">${esc(name)}(${esc(argText)})${status}</div>
    ${result ? `<div class="text">${renderResult(res)}</div>` : ''}
    <button class="small rawtoggle">raw JSON</button>
    <pre class="raw" hidden>${esc(JSON.stringify({arguments: args, result: res}, null, 2))}</pre>
  </div>`;
}
function renderMessages(turn, t) {
  const out = [];
  const msgs = turn.messages;
  for (let i = 0; i < msgs.length; i++) {
    const m = msgs[i], ref = `${t}:${i}`;
    if (m.role === 'tool_call') {
      const next = msgs[i + 1];
      const paired = next && next.role === 'tool_result' && next.name === m.name;
      out.push(toolBox(m, paired ? next : null, ref));
      if (paired) i++;
    } else if (m.role === 'tool_result') {
      out.push(toolBox(null, m, ref));
    } else {
      const who = m.role === 'user' ? 'user' : m.role === 'assistant' ? 'agent' : (m.label || m.role);
      out.push(`<div class="msg ${m.role === 'user' ? 'user' : 'assistant'}" data-ref="${ref}"><div class="who">${esc(who)}</div><div class="text">${esc(m.text)}</div></div>`);
    }
  }
  return out.join('');
}
function renderConv() {
  const main = $('main');
  const c = S.byId[S.cur];
  if (!c) { main.innerHTML = `<div class="empty">Pick a conversation from the list (j / k move between them).</div>`; return; }
  const st = reviewState(c.id), b = batchOf(c.id);
  const key = c.answer_key || {};
  main.innerHTML = `
    <div class="conv-head"><h2>${esc(c.scenario_id)}</h2>

      <span class="muted" style="font-size:12px">Select the text where the first failure shows, type a note, press Enter.</span>
    </div>
    <details class="key"><summary>Show expected outcome (HW3 answer key)</summary><pre>${esc(JSON.stringify(key, null, 2))}</pre></details>
    <div class="reading"><div class="convo" id="convo">${c.turns.map((turn, t) => `
      <div class="turn-divider">Turn ${t + 1} · <a href="${esc(turn.permalink || '#')}" target="_blank" rel="noopener" class="mono">${esc(short(turn.trace_id))}</a> · ${esc((turn.timestamp || '').replace('T', ' ').slice(0, 19))}</div>
      ${renderMessages(turn, t)}`).join('')}</div>
      <div class="margin" id="margin"></div></div>
    ${renderLabelPanel(c.id)}`;
  $('prev').onclick = () => step(-1); $('next').onclick = () => step(1);

  main.querySelectorAll('.more').forEach((b) => b.onclick = () => { b.previousElementSibling.classList.toggle('open'); });
  main.querySelectorAll('.showrows').forEach((b) => b.onclick = () => { b.previousElementSibling.querySelectorAll('tr.extra').forEach((r) => r.hidden = !r.hidden); });

/* ---------- highlights and margin ---------- */
function markText(container, quote, cls, id) {
  if (!quote) return null;
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())) {
    if (node.parentElement.closest('mark, button, .raw')) continue;
    const at = node.nodeValue.indexOf(quote);
    if (at < 0) continue;
    const range = document.createRange();
    range.setStart(node, at); range.setEnd(node, at + quote.length);
    const mark = document.createElement('mark'); mark.className = cls; mark.dataset.id = id;
    range.surroundContents(mark);
    return mark;
  }
  return null;
}
function anchorFor(item) {
  const convo = $('convo');
  const el = convo.querySelector(`[data-ref="${item.turn_index}:${item.msg_index}"]`) || convo;
  return markText(el, item.quote, item._cls, item.id) || el;
}
function applyHighlights() {
  const c = S.byId[S.cur];
  for (const a of annsFor(c.id)) if (a.kind === 'failure') a._anchor = anchorFor({...a, _cls: 'ann'});
  for (const s of S.suggestions.filter((s) => s.conversation_id === c.id && (s.status || 'pending') === 'pending')) s._anchor = anchorFor({...s, _cls: 'sugg'});
}
function layoutMargin() {
  const margin = $('margin'), convo = $('convo'); if (!margin) return;
  const c = S.byId[S.cur];
  const items = [];
  const top = (el) => el ? el.getBoundingClientRect().top - convo.getBoundingClientRect().top : 0;
  for (const a of annsFor(c.id)) items.push({kind: 'ann', a, y: a.kind === 'no_failure' ? 0 : top(a._anchor)});
  for (const s of S.suggestions.filter((s) => s.conversation_id === c.id && (s.status || 'pending') === 'pending')) items.push({kind: 'sugg', s, y: top(s._anchor)});
  items.sort((x, y) => x.y - y.y);
  margin.innerHTML = '';
  let floor = 0;
  for (const it of items) {
    const div = document.createElement('div');
    if (it.kind === 'ann') {
      const a = it.a;
      div.className = 'mnote' + (a.kind === 'no_failure' ? ' clean' : '');
      div.dataset.id = a.id;
      if (S.editing === a.id) {
        div.innerHTML = `<textarea>${esc(a.note)}</textarea><div class="acts" style="display:flex"><button class="small primary sv">save</button><button class="small cx">cancel</button></div>`;
        setTimeout(() => div.querySelector('textarea').focus());
        div.querySelector('.sv').onclick = () => editNote(a, div.querySelector('textarea').value);
        div.querySelector('.cx').onclick = () => { S.editing = null; layoutMargin(); };
        div.querySelector('textarea').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); editNote(a, e.target.value); } if (e.key === 'Escape') { S.editing = null; layoutMargin(); } };
      } else {
        div.innerHTML = `${a.quote ? `<div class="q">“${esc(a.quote.length > 90 ? a.quote.slice(0, 90) + '…' : a.quote)}”</div>` : ''}
          <div>${a.kind === 'no_failure' ? '<b>No failure observed</b>' : esc(a.note)}</div>
          ${a.history?.length ? `<div class="muted" style="font-size:11px">edited ${a.history.length}×</div>` : ''}
          <div class="acts">${a.kind === 'failure' ? '<button class="small ed">edit</button>' : ''}<button class="small del">delete</button></div>`;
        const ed = div.querySelector('.ed'); if (ed) ed.onclick = () => { S.editing = a.id; layoutMargin(); };
        div.querySelector('.del').onclick = () => deleteNote(a);
        div.onmouseenter = () => hot(a.id, true); div.onmouseleave = () => hot(a.id, false);
      }
    } else {
      const s = it.s;
      div.className = 'msugg';
      div.innerHTML = `<div class="tag">AI suggestion · ${esc(s.mode)}</div><div>${esc(s.rationale || '')}</div>
        <div class="acts" style="display:flex;gap:4px;margin-top:4px"><button class="small acc" title="The mode is present here (failure); records a present label">accept: present</button><button class="small rej" title="The mode is absent here; give the boundary that excludes it">reject: absent…</button></div>`;
      div.querySelector('.acc').onclick = () => decide(s, 'accepted');
      div.querySelector('.rej').onclick = () => { const r = prompt('Why reject? Record the boundary that excludes it.'); if (r && r.trim()) decide(s, 'rejected', r); };
    }
    margin.appendChild(div);
    const y = Math.max(it.y, floor);
    div.style.top = y + 'px';
    floor = y + div.offsetHeight + 8;
  }
  margin.style.minHeight = floor + 'px';
}
function hot(id, on) {
  document.querySelectorAll(`mark.ann[data-id="${id}"], .mnote[data-id="${id}"]`).forEach((el) => el.classList.toggle('hot', on));
}

/* ---------- creating and editing open codes ---------- */
function closePopover() {
  document.querySelectorAll('.popover').forEach((p) => p.remove());
  const m = document.querySelector('mark.pending');
  if (m) { m.replaceWith(...m.childNodes); }
  S.pending = null;
}
document.addEventListener('mouseup', (e) => {
  if (S.view !== 'review' || e.target.closest('.popover, .margin, button, summary, a')) return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;
  const quote = sel.toString().trim();
  if (quote.length < 2) return;
  const host = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement).closest('[data-ref]');
  if (!host || !$('convo')?.contains(host)) return;
  closePopover();
  const [turn_index, msg_index] = host.dataset.ref.split(':').map(Number);
  const range = sel.getRangeAt(0);
  const rect = range.getBoundingClientRect();
  try { const m = document.createElement('mark'); m.className = 'pending'; range.surroundContents(m); } catch { /* selection spans elements: keep the quote only */ }
  sel.removeAllRanges();
  S.pending = {turn_index, msg_index, quote};
  const pop = document.createElement('div');
  pop.className = 'popover';
  pop.innerHTML = `<div class="hint">Open code: what went wrong here, in your own words (Enter saves, Shift+Enter new line, Esc cancels)</div>
    <textarea></textarea><div style="display:flex;gap:6px;margin-top:4px"><button class="small primary">save note</button><button class="small">cancel</button></div>`;
  document.body.appendChild(pop);
  pop.style.top = (window.scrollY + rect.bottom + 6) + 'px';
  pop.style.left = Math.min(window.innerWidth - 340, Math.max(8, rect.left)) + 'px';
  const ta = pop.querySelector('textarea'); ta.focus();
  const [save, cancel] = pop.querySelectorAll('button');
  save.onclick = () => commitNote(ta.value); cancel.onclick = closePopover;
  ta.onkeydown = (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commitNote(ta.value); }
    if (ev.key === 'Escape') closePopover();
  };
});
document.addEventListener('mousedown', (e) => { if (S.pending && !e.target.closest('.popover')) closePopover(); });

async function commitNote(text) {
  const note = text.trim(); if (!note || !S.pending) return;
  const c = S.byId[S.cur];
  const turn = c.turns[S.pending.turn_index];
  // One open code per conversation: a failure note replaces a "no failure observed" record.
  for (const a of annsFor(c.id)) if (a.kind === 'no_failure') a.deleted_at = now();
  S.annotations.push({
    id: newId('ann'), trace_id: c.id, turn_trace_id: turn.trace_id, session_id: c.session_id,
    scenario_id: c.scenario_id, author: 'human', kind: 'failure', note, quote: S.pending.quote,
    turn_index: S.pending.turn_index, msg_index: S.pending.msg_index, batch: batchOf(c.id) || null,
    created_at: now(), updated_at: now(), history: [],
  });
  closePopover();
  await saveAnnotations(); renderConv(); renderRows();
}
async function toggleClean(c) {
  const existing = annsFor(c.id).find((a) => a.kind === 'no_failure');
  if (existing) existing.deleted_at = now();
  else S.annotations.push({
    id: newId('ann'), trace_id: c.id, turn_trace_id: c.turns[0].trace_id, session_id: c.session_id,
    scenario_id: c.scenario_id, author: 'human', kind: 'no_failure', note: 'no failure observed', quote: '',
    batch: batchOf(c.id) || null, created_at: now(), updated_at: now(), history: [],
  });
  await saveAnnotations(); renderConv(); renderRows();
}
async function editNote(a, text) {
  const note = text.trim(); if (!note) return;
  if (note !== a.note) { a.history = [...(a.history || []), {note: a.note, at: a.updated_at}]; a.note = note; a.updated_at = now(); }
  S.editing = null; await saveAnnotations(); renderConv();
}
async function deleteNote(a) {
  if (!confirm('Delete this note? It stays in the saved history as deleted.')) return;
  a.deleted_at = now(); await saveAnnotations(); renderConv(); renderRows();
}
async function saveAnnotations() {
  const clean = S.annotations.map(({_anchor, ...rest}) => rest);
  try { localStorage.setItem('hw4-annotations-backup', JSON.stringify(clean)); } catch {}
  try { await api('/api/annotations', {annotations: clean}); S.savedAnnotations = JSON.stringify(clean); setStatus('saved'); }
  catch (e) { setStatus('SAVE FAILED: ' + e.message); toast('Save failed: ' + e.message); }
}

/* ---------- labels ---------- */
function renderLabelPanel(cid) {
  const modes = activeModes();
  if (!modes.length) return `<div class="labels-panel"><h3>Structured labels</h3><div class="muted">No failure modes yet. Labels appear here once the taxonomy has modes (Part D/E).</div></div>`;
  return `<div class="labels-panel"><h3>Structured labels <span class="muted" style="font-weight:400;font-size:12px">one present/absent judgment per mode; saved to labels/ and Langfuse</span></h3>
    ${modes.map((m) => {
      const l = labelOf(m.name, cid);
      return `<div class="lrow" data-mode="${esc(m.name)}"><div><div class="name">${esc(m.name)}</div>${m.status !== 'confirmed' ? `<div class="cand">${esc(m.status)}</div>` : ''}</div>
        <div class="seg"><button class="present ${l && l.label === 1 ? 'on' : ''}" data-v="1">present (fail)</button><button class="absent ${l && l.label === 0 ? 'on' : ''}" data-v="0">absent</button></div>
        <input type="text" placeholder="evidence (optional)" value="${esc(l ? l.evidence : '')}">
        <div class="ldef">${esc(m.definition || '')}</div></div>`;
    }).join('')}
    <div class="lacts"><button class="small" id="l-rest" ${missingModes(cid).length ? '' : 'disabled'}>Mark the rest absent (${missingModes(cid).length})</button>
      <button class="small" id="l-next">Next unlabeled →</button>
      <span class="muted">${unlabeledCount()} of ${manifestItems().length} conversations still have open labels</span></div></div>`;
}
const missingModes = (cid) => activeModes().filter((m) => !labelOf(m.name, cid));
const unlabeledCount = () => labelingOrder().filter((id) => missingModes(id).length).length;
/* Conversations with a failure note come first, then manifest order. */
function labelingOrder() {
  const ids = manifestItems().map((i) => i.conversation_id).filter((id) => S.byId[id]);
  return [...ids.filter((id) => reviewState(id) === 'fail'), ...ids.filter((id) => reviewState(id) !== 'fail')];
}
function nextUnlabeled(cid) {
  const ids = labelingOrder(), i = ids.indexOf(cid);
  const next = [...ids.slice(i + 1), ...ids.slice(0, i + 1)].find((id) => missingModes(id).length);
  if (!next) { toast('Every conversation has all its labels.'); return; }
  $('f-scope').value = 'sample'; openConv(next);
}
/* Only fills modes with no label yet, on this conversation; never overwrites. */
async function markRestAbsent(cid) {
  const btn = $('l-rest'); btn.disabled = true; btn.textContent = 'Saving…';
  let failed = 0, lf = '';
  for (const m of missingModes(cid)) {
    try {
      const r = await api('/api/labels', {mode: m.name, conversation_id: cid, label: 0, evidence: '', source: 'human', only_if_missing: true});
      S.labels[m.name] = S.labels[m.name] || {}; S.labels[m.name][cid] = r.row; lf = r.langfuse;
    } catch (e) { failed += 1; toast('Label not fully saved: ' + e.message); }
  }
  if (failed) await refreshLabels();
  setStatus(`labels saved · Langfuse ${lf}`);
  const y = $('main').scrollTop; renderConv(); $('main').scrollTop = y; updateCounts();
}
function bindLabelPanel(cid) {
  document.querySelectorAll('.lrow').forEach((row) => {
    row.querySelectorAll('.seg button').forEach((b) => b.onclick = () => setLabel(row.dataset.mode, cid, Number(b.dataset.v), row.querySelector('input').value));
    row.querySelector('input').onchange = (e) => { const l = labelOf(row.dataset.mode, cid); if (l) setLabel(row.dataset.mode, cid, l.label, e.target.value); };
  });
  if ($('l-rest')) { $('l-rest').onclick = () => markRestAbsent(cid); $('l-next').onclick = () => nextUnlabeled(cid); }
}
async function setLabel(mode, cid, label, evidence) {
  try {
    const r = await api('/api/labels', {mode, conversation_id: cid, label, evidence, source: 'human'});
    S.labels[mode] = S.labels[mode] || {}; S.labels[mode][cid] = r.row;
    setStatus(`label saved · Langfuse ${r.langfuse}`);
  } catch (e) { toast('Label not fully saved: ' + e.message); await refreshLabels(); }
  if (S.view === 'review') { const y = $('main').scrollTop; renderConv(); $('main').scrollTop = y; } else renderLabeling();
  updateCounts();
}
async function refreshLabels() { S.labels = await api('/api/labels'); }

/* ---------- suggestions ---------- */
async function decide(s, status, reason) {
  try {
    const r = await api('/api/suggestions/decide', {id: s.id, status, reason: reason || ''});
    Object.assign(s, r.suggestion);
    if (r.label) { await refreshLabels(); setStatus(`suggestion ${status} · label Langfuse ${r.label.langfuse}`); }
  } catch (e) { toast('Not saved: ' + e.message); }
  render();
}
function renderSuggestions() {
  const el = $('suggestions');
  const modes = [...new Set(S.suggestions.map((s) => s.mode))];
  if (!S.suggestions.length) { el.innerHTML = `<h2>AI suggestions</h2><div class="empty">No suggestions yet. Search results for a confirmed mode appear here in Part D. Each one needs your explicit accept or reject.</div>`; return; }
  el.innerHTML = `<h2>AI suggestions <span class="muted" style="font-size:13px;font-weight:400">retrieval hits, not labels: accept only after reading the conversation</span></h2>` +
    modes.map((mode) => {
      const list = S.suggestions.filter((s) => s.mode === mode);
      return `<h3 class="mono">${esc(mode)} <span class="muted">${list.filter((s) => (s.status || 'pending') === 'pending').length} pending of ${list.length}</span></h3>` +
        list.map((s) => {
          const c = S.byId[s.conversation_id] || {};
          const st = s.status || 'pending';
          return `<div class="sugg-card ${st}" data-id="${esc(s.id)}"><div class="tag">AI suggestion · ${esc(st)}${s.search_round ? ' · search round ' + esc(s.search_round) : ''}${s.method ? ' · ' + esc(s.method) : ''}</div>
            <div><span class="chip" data-go="${esc(s.conversation_id)}">${esc(c.scenario_id || short(s.conversation_id))}</span> ${esc(c.role || '')} ${s.quote ? `· <i>“${esc(s.quote)}”</i>` : ''}</div>
            <div>${esc(s.rationale || '')}</div>
            ${st === 'pending' ? `<div class="acts"><button class="small acc" title="Records a present (failure) label for this mode">Accept: mode present (failure)</button><input placeholder="boundary that excludes it (required to reject)"><button class="small rej" title="The mode is absent; no failure label">Reject: mode absent</button></div>`
              : `<div class="muted" style="font-size:12px">${esc(st)} by ${esc(s.decided_by || '?')} ${esc(s.decided_at || '')}${s.decision_reason ? ' · ' + esc(s.decision_reason) : ''}</div>`}</div>`;
        }).join('');
    }).join('');
  el.querySelectorAll('.sugg-card').forEach((card) => {

    if (rej) rej.onclick = () => { const r = card.querySelector('input').value.trim(); if (!r) { toast('Write the reason first'); return; } decide(s, 'rejected', r); };
  });
  el.querySelectorAll('[data-go]').forEach((x) => x.onclick = () => { $('f-scope').value = 'all'; openConv(x.dataset.go); });
}

/* ---------- labeling table ---------- */
function renderLabeling() {

    <table class="labels"><tr><th>conversation</th><th>batch</th>${modes.map((m) => `<th title="${esc(m.definition || '')}">${esc(m.name)}${m.status !== 'confirmed' ? '*' : ''}</th>`).join('')}</tr>

    ${ids.map((id) => `<tr data-go="${id}"><td>${esc(S.byId[id].scenario_id)} <span class="muted">${esc(S.byId[id].role)}</span></td><td class="muted">${esc(batchOf(id) || '')}</td>${modes.map((m) => {

      return l ? `<td class="${l.label === 1 ? 'p' : 'a'}" title="${esc(l.evidence || '')} (${esc(l.source)})">${l.label === 1 ? 'P' : 'A'}</td>` : '<td class="n">·</td>';
    }).join('')}</tr>`).join('')}</table>
    <p class="muted" style="font-size:12px">* candidate mode, not yet confirmed. Sample fractions describe this reviewed sample only, not prevalence.</p>`;
  el.querySelectorAll('tr[data-go]').forEach((r) => r.onclick = () => { $('f-scope').value = 'sample'; openConv(r.dataset.go); });
  if ($('lab-next')) $('lab-next').onclick = () => nextUnlabeled(null);
}

/* ---------- progress ---------- */
function renderProgress() {
  const el = $('progress');
  const items = manifestItems();
  const batches = [...new Set([...Object.keys(BATCH_NAMES), ...items.map((i) => i.batch)])];
  const reviewedAll = new Set(liveAnns().map((a) => a.trace_id));
  const conf = confirmedModes();
  const rows = batches.map((b) => {
    const ids = items.filter((i) => i.batch === b).map((i) => i.conversation_id);
    const st = ids.map(reviewState);
    const incomplete = ids.filter((id) => conf.some((m) => !labelOf(m.name, id))).length;
    return {b, n: ids.length, fail: st.filter((s) => s === 'fail').length, clean: st.filter((s) => s === 'clean').length, todo: st.filter((s) => s === 'todo').length, incomplete};
  });
  const tot = rows.reduce((t, r) => ({n: t.n + r.n, fail: t.fail + r.fail, clean: t.clean + r.clean, todo: t.todo + r.todo, incomplete: t.incomplete + r.incomplete}), {n: 0, fail: 0, clean: 0, todo: 0, incomplete: 0});
  const outside = [...reviewedAll].filter((id) => !items.some((i) => i.conversation_id === id));
  const newInFinal = [...(S.patterns.modes || []), ...(S.patterns.unadopted_modes || [])].filter((m) => m.first_seen_batch === 'final_random' && m.status !== 'rejected');
  el.innerHTML = `<h2>Progress</h2>
    <table class="stats"><tr><th>batch</th><th>in sample</th><th>failure noted</th><th>no failure</th><th>not reviewed</th><th>missing labels (confirmed modes)</th></tr>
    ${rows.map((r) => `<tr><td>${esc(BATCH_NAMES[r.b] || r.b)}</td><td>${r.n}</td><td>${r.fail}</td><td>${r.clean}</td><td>${r.todo}</td><td>${conf.length ? r.incomplete : '—'}</td></tr>`).join('')}
    <tr><th>total</th><th>${tot.n}</th><th>${tot.fail}</th><th>${tot.clean}</th><th>${tot.todo}</th><th>${conf.length ? tot.incomplete : '—'}</th></tr></table>
    <p>Distinct conversations reviewed: <b>${tot.fail + tot.clean}</b> of the 100 required.
      ${outside.length ? `<br><span class="muted">${outside.length} reviewed conversation(s) are not in the sample manifest.</span>` : ''}</p>
    <p>Modes: ${(S.patterns.modes || []).length} total, ${conf.length} confirmed. New modes first seen in the final random batch: <b>${newInFinal.length}</b>${newInFinal.length ? ' (' + newInFinal.map((m) => esc(m.name)).join(', ') + ')' : ''}.</p>
    <p>AI suggestions: ${pendingSuggs().length} pending, ${S.suggestions.filter((s) => s.status === 'accepted').length} accepted, ${S.suggestions.filter((s) => s.status === 'rejected').length} rejected.</p>
    ${tot.todo ? `<h3 style="font-size:14px">Not reviewed yet</h3>${chipList(items.filter((i) => reviewState(i.conversation_id) === 'todo').map((i) => i.conversation_id))}` : ''}
    ${conf.length && tot.incomplete ? `<h3 style="font-size:14px">Missing at least one label</h3>${chipList(items.map((i) => i.conversation_id).filter((id) => conf.some((m) => !labelOf(m.name, id))))}` : ''}`;
  el.querySelectorAll('[data-go]').forEach((x) => x.onclick = () => { $('f-scope').value = 'sample'; openConv(x.dataset.go); });
}

/* ---------- shell ---------- */
function setStatus(t) { $('status').textContent = t; }
function updateCounts() {
  const items = manifestItems();
  const reviewed = items.filter((i) => reviewState(i.conversation_id) !== 'todo').length;
  $('c-review').textContent = items.length ? `${reviewed}/${items.length}` : '';
  $('c-taxonomy').textContent = (S.patterns.modes || []).length || '';
  $('c-suggestions').textContent = pendingSuggs().length || '';
  const conf = confirmedModes();
  $('c-labeling').textContent = conf.length ? items.filter((i) => conf.every((m) => labelOf(m.name, i.conversation_id))).length + '/' + items.length : '';
}
function switchView(v) {
  S.view = v;
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.view === v));
  document.querySelectorAll('.view').forEach((x) => x.classList.toggle('active', x.id === 'v-' + v));
  render();
}
function render() {
  updateCounts();
  if (S.view === 'review') { renderRows(); const y = $('main').scrollTop; renderConv(); $('main').scrollTop = y; }
  if (S.view === 'taxonomy') renderTaxonomy();
  if (S.view === 'suggestions') renderSuggestions();
  if (S.view === 'labeling') renderLabeling();
  if (S.view === 'progress') renderProgress();
}
function fillBatchFilter() {
  const batches = [...new Set(manifestItems().map((i) => i.batch))];
  $('f-batch').innerHTML = '<option value="">All batches</option>' + batches.map((b) => `<option value="${esc(b)}">${esc(BATCH_NAMES[b] || b)}</option>`).join('');
}
async function poll() {
  try {
    const [manifest, patterns, suggestions, labels, ann] = await Promise.all(['/api/manifest', '/api/patterns', '/api/suggestions', '/api/labels', '/api/annotations'].map((p) => api(p)));
    const changed = [];
    // Adopt notes changed on the server (never while a note is being written).
    const serverAnns = JSON.stringify(ann.annotations || []);
    let annsChanged = false;
    if (serverAnns !== S.savedAnnotations && !S.pending && !S.editing) {
      S.annotations = ann.annotations || []; S.savedAnnotations = serverAnns; annsChanged = true;
      changed.push('notes updated on the server');
    }
    if ((manifest.items || []).length !== manifestItems().length) changed.push(`review sample now ${manifest.items.length} conversations`);
    if (JSON.stringify(patterns) !== JSON.stringify(S.patterns)) changed.push('taxonomy updated');
    if (suggestions.length !== S.suggestions.length) changed.push(`${suggestions.length - S.suggestions.length} new suggestion(s)`);
    const labelsChanged = JSON.stringify(labels) !== JSON.stringify(S.labels);
    const sync = await api('/api/labels/sync');
    if (sync.failed.length) setStatus(`${sync.failed.length} Langfuse score(s) failed; labels are saved locally`);
    if (!changed.length && !labelsChanged && !annsChanged) return;
    S.manifest = manifest; S.patterns = patterns; S.suggestions = suggestions; S.labels = labels;
    fillBatchFilter();
    if (changed.length) toast(changed.join(' · '));
    // Do not re-render the reading pane under an open note editor.
    if (S.view !== 'review' || (!S.pending && !S.editing)) render(); else updateCounts();
  } catch (e) { setStatus('server unreachable'); }
}
document.querySelectorAll('#nav button').forEach((b) => b.onclick = () => switchView(b.dataset.view));
['f-scope', 'f-batch', 'f-state'].forEach((id) => $(id).onchange = renderRows);
$('f-text').oninput = renderRows;
document.addEventListener('keydown', (e) => {
  if (S.view !== 'review' || e.target.closest('input, textarea, select')) return;
  if (e.key === 'j') step(1); if (e.key === 'k') step(-1);
});
window.addEventListener('resize', () => { if (S.view === 'review' && S.cur) layoutMargin(); });

(async function boot() {
  const [convs, manifest, ann, patterns, suggestions, labels] = await Promise.all(
    ['/api/conversations', '/api/manifest', '/api/annotations', '/api/patterns', '/api/suggestions', '/api/labels'].map((p) => api(p)));
  S.convs = convs; S.byId = Object.fromEntries(convs.map((c) => [c.id, c]));
  S.manifest = manifest; S.annotations = ann.annotations || []; S.savedAnnotations = JSON.stringify(S.annotations); S.patterns = patterns; S.suggestions = suggestions; S.labels = labels;
  if (!manifestItems().length) $('f-scope').value = 'all';
  fillBatchFilter();
  const ids = listConvs(); S.cur = ids[0] || null;
  setStatus(`${convs.length} conversations · ${liveAnns().length} notes`);
  render();
  setInterval(poll, 4000);
})();
</script>
</body>
</html>
